# Netlify configuration — ThreadCraft Studio customer frontend (React/Vite SPA)
# The Express backend deploys separately (Render/Railway/EC2…) — do NOT force
# it into Netlify Functions. Architecture:
#   Netlify (this SPA)  →  VITE_API_URL  →  Express API  →  MongoDB Atlas
#                                                        →  Cloudinary
#                                                        →  Razorpay

[build]
  base    = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback: every unknown route serves index.html so /shop, /product/:id,
# /cart, /checkout, /login, /admin/* etc. survive hard refresh. The explicit
# _redirects file in client/public/ handles this too; both stay in sync.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Long-cache immutable build assets (hashed filenames)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
