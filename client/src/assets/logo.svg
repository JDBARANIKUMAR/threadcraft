<svg width="200" height="50" viewBox="0 0 200 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1fd1f9" />
      <stop offset="100%" stop-color="#b621fe" />
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur" />
      <feComponentTransfer>
        <feFuncA type="discrete" tableValues="1 1" />
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="coloredBlur" mode="normal" />
    </filter>
  </defs>
  <rect width="200" height="50" rx="12" ry="12" fill="url(#grad)" filter="url(#blur)" />
  <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" font-family="Inter, sans-serif" font-size="24" fill="white" >ThreadCraft</text>
</svg>
